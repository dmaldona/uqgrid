name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PETSC_DIR: /usr/lib/petsc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PETSc
        run: |
          sudo apt-get update
          sudo apt-get install -y petsc-dev python3-petsc4py python3-petsc4py-real python3-venv

      - name: Set up Python
        run: |
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/uqgrid-ci-venv"
          echo "$RUNNER_TEMP/uqgrid-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep the NumPy ABI used by Ubuntu's prebuilt PETSc bindings.
          python -m pip install "numpy<2" -e ".[dev,pypower]"

      - name: Verify PETSc
        run: |
          python - <<'PYTHON'
          import sys
          import petsc4py
          from petsc4py import PETSc

          vector = PETSc.Vec().createSeq(1, comm=PETSc.COMM_SELF)
          vector.destroy()
          print("Python:", sys.version)
          print("petsc4py:", petsc4py.__version__)
          print("PETSc:", PETSc.Sys.getVersion())
          PYTHON

      - name: Lint
        run: |
          python -m ruff check .

      - name: Run tests with coverage
        run: |
          python -m pytest -ra --junitxml=junit.xml --cov=uqgrid --cov-report=term-missing --cov-report=xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
