[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uqgrid"
version = "0.1.0"
description = "Uncertainty quantification for the electrical grid"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "D. Adrian Maldonado", email = "maldonadod@anl.gov"}
]

# Core dependencies only
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "numba>=0.56.0",
    "matplotlib>=3.5.0",
    "networkx>=2.6.0",
    "pydantic>=2.0.0",
    "numdifftools>=0.9.41",
]

[project.optional-dependencies]
# PETSc support (optional)
petsc = [
    "petsc4py>=3.16.0",
]

# Development dependencies (basic)
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
    "pytest-cov>=4.0.0",
    "coverage[toml]>=7.0.0",
    "ruff>=0.5.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "vulture>=2.7",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/dmaldona/uqgrid"
Repository = "https://github.com/dmaldona/uqgrid"

[tool.setuptools.packages.find]
where = ["."]
include = ["uqgrid*"]
exclude = ["tests*"]

# Basic pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "adjoint: marks tests as adjoint validation tests (slow)",
]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    "ignore:Transformer Magnetizing Impedance not Implemented:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["uqgrid"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true