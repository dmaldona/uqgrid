site_name: UQGrid
site_description: "Uncertainty quantification workflows for power systems"
site_url: ""
repo_url: https://github.com/dmaldona/uqgrid
repo_name: dmaldona/uqgrid
docs_dir: docs
nav:
  - Home: index.md
  - SNB Module: snb.md
theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.instant
    - navigation.sections
    - toc.follow
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js
  - javascripts/math.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dmaldona/uqgrid
      name: GitHub
